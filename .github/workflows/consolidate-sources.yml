name: Consolidate repository history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/consolidate-sources.yml"
      - "sources.json"
      - "scripts/consolidate_sources.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: markazi1-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout central repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Consolidate accessible source repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_WRITE_TOKEN: ${{ secrets.TARGET_WRITE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          SOURCE_TOKEN_MAHDITT96: ${{ secrets.SOURCE_TOKEN_MAHDITT96 }}
          SOURCE_TOKEN_MMLABSAI: ${{ secrets.SOURCE_TOKEN_MMLABSAI }}
          SOURCE_TOKEN_MATAGHDISI96_SOURCE: ${{ secrets.SOURCE_TOKEN_MATAGHDISI96_SOURCE }}
        run: python3 scripts/consolidate_sources.py
